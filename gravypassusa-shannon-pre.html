<!DOCTYPE html>
<html lang="en" data-slice="GRAVYPASSUSA-SHANNON" data-geo="US">
<head>
<meta charset="UTF-8">
<meta name="x-dest" content="/gravypassusa-shannon.html">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080a09">
<title>Open in Browser</title>
<meta name="robots" content="noindex,nofollow">
<meta name="x-pre" content="1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #080a09;
        --card: #111312;
        --border: rgba(255,255,255,0.06);
        --accent: #3ee07d;
        --accent-dim: rgba(62,224,125,0.15);
        --accent-glow: rgba(62,224,125,0.4);
        --text: #f4f5f4;
        --muted: #6f746f;
        --muted2: #8b908d;
    }

    html, body {
        height: 100%;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 24px;
        overflow: hidden;
        position: relative;
    }

    /* Background glow — matches lander */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse 60% 40% at 50% 0%, rgba(62,224,125,0.12) 0%, transparent 65%),
            radial-gradient(ellipse 40% 30% at 100% 100%, rgba(62,224,125,0.06) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
    }

    .wrap {
        position: relative;
        z-index: 1;
        max-width: 400px;
        width: 100%;
        text-align: center;
        animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* Icon box */
    .icon-wrap {
        width: 88px;
        height: 88px;
        margin: 0 auto 28px;
        border-radius: 22px;
        border: 1px solid rgba(62,224,125,0.25);
        background: var(--accent-dim);
        display: grid;
        place-items: center;
        animation: iconGlow 3s ease-in-out infinite;
    }

    @keyframes iconGlow {
        0%, 100% { box-shadow: 0 0 30px rgba(62,224,125,0.2); }
        50%       { box-shadow: 0 0 60px rgba(62,224,125,0.4); }
    }

    .icon-wrap svg {
        width: 36px;
        height: 36px;
        color: var(--accent);
        stroke-width: 2.5;
    }

    /* Heading */
    h1 {
        font-family: "Inter", sans-serif;
        font-size: 48px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -1.5px;
        margin-bottom: 12px;
        color: var(--text);
    }

    h1 .hl {
        color: var(--accent);
    }

    /* Sub */
    .sub {
        font-size: 14px;
        font-weight: 700;
        color: var(--muted2);
        line-height: 1.55;
        margin-bottom: 36px;
    }

    /* CTA */
    .cta {
        display: block;
        width: 100%;
        background: var(--accent);
        color: #062012;
        font-family: "Inter", sans-serif;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        padding: 18px 24px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        margin-bottom: 20px;
        transition: transform 0.1s ease;
        animation: ctaPulse 2.5s ease-in-out infinite;
    }

    .cta:active { transform: scale(0.97); }

    @keyframes ctaPulse {
        0%, 100% { box-shadow: 0 0 40px var(--accent-glow), 0 4px 20px rgba(0,0,0,0.4); }
        50%       { box-shadow: 0 0 70px var(--accent-glow), 0 4px 20px rgba(0,0,0,0.4); }
    }

    /* Chips */
    .chips {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.3px;
    }

    .chips .dot {
        width: 3px;
        height: 3px;
        background: var(--muted);
        border-radius: 50%;
        opacity: 0.4;
    }

    @media (max-height: 640px) {
        .icon-wrap { width: 70px; height: 70px; margin-bottom: 20px; }
        .icon-wrap svg { width: 28px; height: 28px; }
        h1 { font-size: 38px; }
        .sub { margin-bottom: 24px; }
    }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
        body { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    }

    /* The three infinite animations above start at a non-default state, so suppressing motion has
       to restore that state explicitly or the page renders wrong rather than merely still. */
    @media (prefers-reduced-motion: reduce) {
        .wrap { animation: none; opacity: 1; transform: none; }
        .icon-wrap, .cta { animation: none; }
        .cta { transition: none; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    }
</style>
</head>
<body>
    <div class="wrap">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 17L17 7"></path>
                <path d="M7 7h10v10"></path>
            </svg>
        </div>
        <h1>Open in <span class="hl">Browser</span></h1>
        <p class="sub">Tap Continue to open this page in your browser for the full experience.</p>
        <button class="cta" id="ctaBtn" type="button">Continue</button>
        <div class="chips">
            <span>Safari</span>
            <span class="dot"></span>
            <span>Chrome</span>
            <span class="dot"></span>
            <span>Secure</span>
        </div>
    </div>

    <script>
    
    (function () {
        'use strict';
        var btn = document.getElementById('ctaBtn');
        if (!btn) return;

        
        var BEACON = '/api/funnel-beacon';
        var q = new URLSearchParams(location.search);

        /* The journey id. Minted here, carried to the lander, and the ONLY thing that makes the
           four events one story: without it you have four counters and cannot tell a failed
           breakout from a lander bounce. Rides the query and is stripped before the network URL. */
        var sid = q.get('sid') || '';
        if (!sid) {
            try { sid = (crypto.randomUUID ? crypto.randomUUID() : '').replace(/-/g, ''); } catch (e) { sid = ''; }
            if (!sid) sid = Date.now().toString(36) + Math.random().toString(36).slice(2);
            sid = sid.slice(0, 32);
            q.set('sid', sid);
        }

        /* Slice/clone labels. Read from the markup when the page declares them, falling back to
           the path for clone directories that do not. Flat pages have ONE path segment, so
           positional parsing would report clone='' forever — but the fix must not be a constant in
           this script: _tracking-audit hashes these bodies, and a per-page constant here is what
           gives 7 geos 7 different "identical" prelanders. Same rule as landerUrl above: per-page
           values live in the markup, behaviour lives in the script. */
        var root = document.documentElement;
        var seg = location.pathname.replace(/\/index\.html$/, '').split('/').filter(Boolean);
        var pgSlice = root.getAttribute('data-slice') || seg[0] || '';
        var pgClone = root.getAttribute('data-geo') || seg[1] || '';
        function beacon(event) {
            try {
                var b = new Blob([JSON.stringify({
                    event: event, sid: sid,
                    s1: q.get('s1') || '', s2: q.get('s2') || '', s3: q.get('s3') || '',
                    ttclid: q.get('ttclid') || '',
                    slice: pgSlice, clone: pgClone, path: location.pathname
                })], { type: 'text/plain' });   /* see the note in lander-beacon.py: text/plain skips
                       the CORS preflight that was blocking every beacon on the first live test */
                navigator.sendBeacon(BEACON, b);
            } catch (e) { /* analytics must never break the funnel */ }
        }
        beacon('pre_view');

        /* ── THE PAGE SWITCH ──────────────────────────────────────────────────────────────────
           The lander this page opens can be set per code. At load, when the query carries a code,
           the page asks the same-origin /api/hop, once. The answer is { t }, the lander path to
           open, and optionally { y }, the code to carry instead; only that one token is swapped and
           the rest of the query rides along untouched, exactly as below.

           · No code: no request, no wait. The page is exactly what it was.
           · The answer depends on the code alone. Nothing here reads the user agent, the address or
             the country, and nothing changes what this page renders.
           · The jump must happen synchronously inside the tap (see go()), so the answer has to be in
             memory BEFORE the tap. Until it arrives, for at most HOP_WAIT ms from load, a tap is
             ignored (not disabled: nothing on screen changes), so where Continue goes cannot depend
             on how quickly someone taps. An answer later than HOP_WAIT is dropped.
           · Any failure (no fetch, a throw, an error status, a slow or malformed answer, a path that
             is not a plain lander on this origin) leaves `hop` null, and landerUrl() does exactly
             what it always did.

           ⚠️ THE WHOLE BLOCK IS INSIDE try/catch. The Continue handler is attached at the very end of
           this function, so a throw here would leave the button dead on every page that runs this
           script, switched or not. Helpers are function declarations at this level, never inside a
           block: a block-level function declaration is a syntax error in an older strict-mode engine,
           and a syntax error is a dead page. */
        var HOP_WAIT = 800;
        var HOP_RESERVED = ['api', 'click', 'c', 'r', 'u', 'pre', 'admin', 'portal', 'js', 'images', 'postback', 'go'];
        var hop = null, hopWait = false, hopTimer = 0;

        /* Two paths name the same page: '/X/Y/', '/X/Y' and '/X/Y/index.html' are one page. */
        function samePage(a, b) {
            function norm(p) { return String(p).replace(/\/index\.html$/i, '/').replace(/\/+$/, '').toLowerCase(); }
            return norm(a) === norm(b);
        }

        /* The code inside a query value, matched the way the lander matches it, uppercased. */
        function codeIn(v) {
            return (String(v).match(/SPK-[0-9A-F]{4}-[0-9A-F]{4}(?:-\d+)?/i) || [''])[0].toUpperCase();
        }

        /* An answer is used only when every part of it is exactly what it may be: a lander path on
           this origin (never a reserved route, never a prelander, never this page), and a `y` only
           together with that path. A code with a numeric suffix is looked up as itself and is never
           switched, so an answer for one is not used either. */
        function hopAnswer(a, code) {
            try {
                if (!a || typeof a !== 'object') return null;
                var t = a.t, y = a.y;
                if (typeof t !== 'string' || t.length > 200 || !/^\/[A-Za-z0-9._\/-]+$/.test(t)) return null;
                /* No segment may start with '.': a browser folds such a segment away AFTER these checks. */
                if (t.indexOf('//') !== -1 || t.indexOf('..') !== -1 || t.indexOf('/.') !== -1) return null;
                if (!/(?:\.html|\/go\/)$/.test(t) || /-pre\d*\.html$/i.test(t)) return null;
                if (HOP_RESERVED.indexOf(t.split('/')[1].replace(/\.html$/i, '').toLowerCase()) !== -1) return null;
                if (samePage(t, location.pathname)) return null;
                if (!/^SPK-[0-9A-F]{4}-[0-9A-F]{4}$/.test(code)) return null;
                if (y === undefined || y === null || y === '') return { t: t, y: '', c: code };
                if (typeof y !== 'string' || !/^SPK-[0-9A-F]{4}-[0-9A-F]{4}$/.test(y) || y === code) return null;
                return { t: t, y: y, c: code };
            } catch (e) { return null; }
        }

        /* Swap one exact code for another inside a query value. Matched with the same pattern the
           lander uses, so a token with a numeric suffix is a different token and stays as it is. */
        function swapCode(v, from, to) {
            return String(v).replace(/SPK-[0-9A-F]{4}-[0-9A-F]{4}(?:-\d+)?/gi, function (m) {
                return m.toUpperCase() === from ? to : m;
            });
        }

        /* The switched lander URL, or '' for the built-in one. '' too unless the lander will read
           exactly the code the answer expects (`y` when there is one): a switched path never goes
           out with the wrong code, and `y` never goes out without its path. */
        function switchedUrl() {
            try {
                if (!hop) return '';
                var out = new URLSearchParams();
                q.forEach(function (v, k) {
                    out.append(k, hop.y && (k === 's1' || k === 'sub1') ? swapCode(v, hop.c, hop.y) : v);
                });
                if (codeIn(out.get('s1') || out.get('sub1') || '') !== (hop.y || hop.c)) return '';
                var qs = out.toString();
                return location.origin + hop.t + (qs ? '?' + qs : '');
            } catch (e) { return ''; }
        }

        try {
            var hopCode = codeIn(q.get('s1') || q.get('sub1') || '');
            if (hopCode && typeof fetch === 'function') {
                var hopCtl = typeof AbortController === 'function' ? new AbortController() : null;
                var hopSettle = function (ans) {
                    if (!hopWait) return;
                    hopWait = false;
                    clearTimeout(hopTimer);
                    hop = ans;
                };
                hopWait = true;
                hopTimer = setTimeout(function () {
                    hopSettle(null);
                    if (hopCtl) { try { hopCtl.abort(); } catch (e) { /* already settled */ } }
                }, HOP_WAIT);
                var hopInit = { credentials: 'omit' };
                if (hopCtl) hopInit.signal = hopCtl.signal;
                fetch('/api/hop?c=' + encodeURIComponent(hopCode), hopInit)
                    .then(function (r) { return r && r.ok ? r.json() : null; })
                    .then(function (a) { hopSettle(hopAnswer(a, hopCode)); })
                    .then(null, function () { hopSettle(null); });
            }
        } catch (e) {
            hopWait = false;
            hop = null;
            try { clearTimeout(hopTimer); } catch (e2) { /* nothing to undo */ }
        }

        /* The lander. TWO page shapes, ONE code path — which is the whole point.

           · Clone directories (50FC/FC7/, AC54/US1/, …): no meta tag, so it resolves against THIS
             clone's own directory, exactly as before. `new URL`-free on purpose so it behaves the
             same on old in-app webviews; the two replaces normalise a path with or without its
             trailing slash, and a literal /index.html, to the same base.
           · Flat pages (/frcusa-pre -> /frcusa): a <meta name="x-dest"> names the destination.

           ⚠️ THE DESTINATION IS DATA, NOT CODE, AND THAT IS DELIBERATE. Baking the path into this
           function instead would give every flat page its own script body, and _tracking-audit
           hashes these script bodies to prove the breakout is ONE reviewed behaviour rather than
           1,410 individually-editable ones. A per-page constant in the markup keeps that guarantee;
           a per-page constant in the script destroys it. (Tried the other way first — the audit
           caught it, which is what it is for.)

           It is still not a ?to= param: the value is written into the file at generation time and
           cannot be set by a visitor, so there is no allowlist and nothing to keep in sync. */
        /* `q`, not location.search, so the sid minted above rides to the lander. */
        /* The one exception to data-in-the-markup is THE PAGE SWITCH above: a path from the
           same-origin hop, used only after hopAnswer() has checked it, and only for the code it was
           asked about. Without a usable answer this is the original logic, unchanged. */
        function landerUrl() {
            var sw = switchedUrl();
            if (sw) return sw;
            var m = document.querySelector('meta[name="x-dest"]');
            var flat = m && m.getAttribute('content');
            var qs = q.toString();
            if (flat && flat.charAt(0) === '/') {
                return location.origin + flat + (qs ? '?' + qs : '');
            }
            var base = location.pathname.replace(/\/index\.html$/, '/').replace(/\/?$/, '/');
            return location.origin + base + 'go/' + (qs ? '?' + qs : '');
        }

        /* ── ESCALATING BREAKOUT ──────────────────────────────────────────────────────────────
           One scheme is not enough. Measured live 2026-08-11: a link tapped from TikTok Messages
           opened the in-app webview and `x-safari-https://` alone did nothing at all — no Safari,
           no error, no visible failure. That is the normal case for a webview that refuses unknown
           schemes: the navigation is simply dropped on the floor.

           So we try the handlers in order, ~350ms apart, and stop the moment the page goes hidden
           (which is the only reliable signal that another app took over):

             iOS      x-safari-https://   Safari's own scheme
                      googlechromes://    Chrome for iOS, if it is installed
             Android  intent:// + package=com.android.chrome   explicitly names Chrome, rather
                                                                than letting the webview claim it
                      intent:// with no package                 the default browser

           WHY THE PACKAGE MATTERS ON ANDROID: an intent with no package lets the SYSTEM pick a
           handler, and inside an in-app browser the host app frequently is one — so the "escape"
           hands the URL straight back to the app it was escaping. Naming Chrome removes that.

           ⚠️ AND IF NONE OF THEM WORK, WE SAY SO RATHER THAN PRETENDING. Some webviews block every
           scheme jump; no JavaScript can defeat that, and quietly forwarding to the lander would
           hide the failure while the visitor sits inside the very browser that breaks the offer.
           After the last attempt the page shows the manual instruction instead. Honest beats
           silent: a visitor who is told to tap "Open in browser" can still convert. */
        function go() {
            var dest = landerUrl();
            var url;

            var bare = dest.replace(/^https?:\/\//, '');
            var attempts = /Android/i.test(navigator.userAgent)
                ? [
                    /* Chrome BY NAME first. An intent with no package lets the system choose a
                       handler, and inside an in-app browser the host app is often one — so the
                       "escape" hands the URL back to the app it was escaping. */
                    'intent://' + bare + '#Intent;scheme=https;package=com.android.chrome;'
                        + 'S.browser_fallback_url=' + encodeURIComponent(dest) + ';end',
                    /* Then whatever the default browser is. S.browser_fallback_url keeps a device
                       with no handler from landing on a dead page, on a click already paid for. */
                    'intent://' + bare + '#Intent;scheme=https;'
                        + 'S.browser_fallback_url=' + encodeURIComponent(dest) + ';end',
                  ]
                : [
                    /* Safari's own scheme. Harmless when already in Safari — it just opens the URL. */
                    dest.replace(/^https:\/\//, 'x-safari-https://'),
                    /* Chrome for iOS, if installed. googlechromes:// is the https variant. */
                    dest.replace(/^https:\/\//, 'googlechromes://'),
                  ];

            /* LAST-RESORT FALLBACK, ARMED BEFORE THE NAVIGATION — never after.
               If the scheme escape is silently swallowed (a webview that blocks unknown schemes
               without erroring) the visitor is stranded here with nothing happening. After a beat
               we navigate normally: still inside the webview, which is worse than Safari but is not
               a dead end.

               ⚠️ ORDER IS THE BUG THIS AVOIDS. Arming the timer and attaching the cancel listeners
               AFTER kicking off the navigation leaves a window in which the app switch can complete
               before the listener exists, so the cancel never runs and the visitor is forwarded
               TWICE — once into Safari and once inside the webview behind it, double-firing the
               lander's pixel. Registering first closes that window.

               ⚠️ visibilitychange, NOT pagehide alone — this is the case that actually matters on
               iOS. x-safari-https:// opens Safari as a SEPARATE APP; this page is backgrounded, not
               unloaded, so pagehide may never fire and a pagehide-only cancel would fire the
               fallback on every SUCCESSFUL breakout. Going hidden is the reliable signal that
               another app took over. */
            /* THE RESCUE GOES TO THE LANDER, NOT THE OFFER (Migi, 2026-08-11). `dest` is ./go.
               Sending a rescued visitor straight to the network would put them on the offer inside
               the very webview this page exists to escape — the failure would be hidden rather than
               fixed, and the offer flow is what degrades there. The lander still works in-app, so
               they keep a usable page and the click is not thrown away.

               pre_rescue is beaconed when this fires: it is the DIRECT measurement of how often the
               scheme escape is swallowed, which is the number that tells you whether the breakout
               is working on real phones. */
            var done = false, timers = [];
            function cancel() {
                if (done) return;
                done = true;
                timers.forEach(clearTimeout);
            }
            window.addEventListener('pagehide', cancel, { once: true });
            window.addEventListener('blur', cancel, { once: true });
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) cancel();
            }, { once: true });

            function jump(u) {
                if (done) return;
                try { (window.top || window).location.href = u; }
                catch (e) { window.location.href = u; }
            }

            /* First attempt fires SYNCHRONOUSLY, inside the tap. iOS only honours a scheme jump
               while the user gesture is still active, so anything deferred is already too late. */
            jump(attempts[0]);
            for (var i = 1; i < attempts.length; i++) {
                (function (u, n) { timers.push(setTimeout(function () { jump(u); }, 350 * n)); })(attempts[i], i);
            }

            /* Nothing took over -> every scheme was refused. Say so instead of silently forwarding:
               dropping them on the lander inside this webview hides the failure while leaving the
               visitor in the browser that breaks the offer. pre_rescue is beaconed either way, and
               it is the direct measurement of how often the escape is swallowed. */
            timers.push(setTimeout(function () {
                if (done) return;
                cancel();
                beacon('pre_rescue');
                var s = document.querySelector('.sub'), b = document.getElementById('ctaBtn');
                if (s) s.innerHTML = 'Your app blocked the browser hand-off. Tap the <b>•••</b> menu '
                    + 'at the top of this screen and choose <b>Open in browser</b>.';
                if (b) { b.disabled = false; b.textContent = 'Continue anyway'; }
                /* A second tap now goes straight through in-app rather than retrying the schemes —
                   they have already been refused, and a visitor who insists should not be stuck. */
                if (b) b.onclick = function (e) { e.preventDefault(); location.replace(dest); };
            }, 350 * attempts.length + 900));
        }

        btn.addEventListener('click', function (e) {
            e.preventDefault();
            /* Held while the switch answer is on its way (at most HOP_WAIT ms from load): no
               beacon, no visual change, the button stays live, and the next tap goes through. */
            if (hopWait) return;
            btn.disabled = true;
            beacon('pre_tap');   /* fired BEFORE go(), so it is sent even if the app switch is instant */
            go();
        });
    })();
    </script>
</body>
</html>
