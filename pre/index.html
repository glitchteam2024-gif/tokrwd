<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Opening your reward…</title>

<!-- TikTok pixel. /pre had NONE until 2026-08-10, which is why the drop-off here was invisible:
     the one page where a visitor can sit for seconds waiting on a scheme handoff was the only page
     in the chain reporting nothing at all. The lander and /safe both had it; this did not.

     ⚠️ READ BEFORE TRUSTING A NUMBER OFF THIS PAGE. The snippet builds `ttq` synchronously but
     QUEUES calls until the SDK arrives (~200-400ms). This page can navigate away at ESCAPE_AT_MS
     (250ms), so a queued event on a FAST, SUCCESSFUL escape is often lost. That skews in one
     direction and it is the safe one: PreView UNDER-reports exactly the visitors who left quickest.
     So do not read PreView as a true denominator — read the ARRIVAL events (LanderView on the
     lander, SafeView on /safe) which always have time to send, and EscapeGaveUp, which fires at
     GIVE_UP_AT_MS with the SDK long since loaded. Those three are reliable. -->
<script>
!function (w, d, t) {
  w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js",o=n&&n.partner;ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};n=document.createElement("script");n.type="text/javascript",n.async=!0,n.src=r+"?sdkid="+e+"&lib="+t;e=document.getElementsByTagName("script")[0];e.parentNode.insertBefore(n,e)};
  ttq.load('D9R5S3BC77UA78AD3M10');
  ttq.page();
}(window, document, 'ttq');

/* The ONE tracking entry point this page exposes. breakout.js calls it and never touches ttq
   directly, so the escape logic keeps working unchanged on any page that ships without a pixel —
   and a pixel outage can never throw inside the code path that forwards a paid click. */
window.__trk = function (name, props) {
  try { if (window.ttq && ttq.track) ttq.track(name, props || {}); } catch (e) {}
};
</script>
<meta name="robots" content="noindex, nofollow">
<!--
  NO WEBFONT ON PURPOSE. A <link rel=stylesheet> is render-blocking, and a classic
  <script src> will not execute until every pending stylesheet has loaded — so a slow
  or blocked fonts.googleapis.com would hold up /js/breakout.js, which is the only
  thing that moves the visitor onward. On a lander a slow font is cosmetic; here it
  gates the click. The landers load Poppins themselves, so this is the only page in
  the funnel that renders in the system stack, and it is on screen for about a second.
-->
<!--
  /pre — the prelander. One page, in front of every landing page.

  ad → Carrd → /r → THIS PAGE → lander → door → offer

  /r picks the lander (lp= / campaign / o= / CARRD_ROUTES / default) and wraps it:
      https://www.tokrwd.co/pre?s1=SPK-…&ttclid=…&s3=…&to=/CLFC
  `to` is a PATH on this site and nothing else — see cleanPath() in /js/breakout.js.

  Everything visible below renders for every visitor, identically, including ad
  review. Nothing here is hidden, gated or swapped based on who is asking; the
  only thing the user agent decides is whether the visitor's browser can be opened
  by an OS scheme. See the header comment in /js/breakout.js for the full rules.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  /* Black + muted gold, per the house direction in SPRKNetworkAds/CLAUDE.md ("dark + muted gold,
     clean, trustworthy"). #D8BA68 is the same gold the app itself uses, not a new one invented
     here. The white card and the two decorative orbs are gone: on a page whose whole job is to get
     one tap, a floating panel and background bubbles are furniture between the visitor and the
     control. What replaces them is a single gold bloom BEHIND the arrow — it points at the thing
     to press instead of decorating the space around it. */
  :root{
    --gold:#D8BA68;
    --gold-lo:#B99A4A;
    --gold-hi:#EBD9A3;
    --ink:#F6F6F8;
    --ink-2:#9A97A6;
    --paper:#08080A;
  }

  body{
    background:
      radial-gradient(60% 45% at 50% 38%, rgba(216,186,104,.10), transparent 70%),
      linear-gradient(to bottom,#0C0C10 0%,#08080A 55%,#050506 100%);
    background-color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    min-height:100vh;min-height:100svh;
    display:flex;justify-content:center;align-items:center;
    padding:24px;position:relative;overflow:hidden;color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* No panel. The content sits straight on the black. */
  .card{
    max-width:460px;width:100%;text-align:center;position:relative;z-index:1;
  }

  h1{
    font-size:clamp(28px,7.5vw,40px);font-weight:800;line-height:1.14;
    letter-spacing:-.02em;margin-bottom:12px;
    background:linear-gradient(135deg,var(--gold-hi) 0%,var(--gold) 55%,var(--gold-lo) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .sub{font-size:clamp(14px,3.6vw,16px);color:var(--ink-2);line-height:1.6;margin-bottom:34px}

  /* THE GLOW. A blurred gold disc sitting behind the button, not on it — so the light reads as
     coming off the control rather than as a border drawn around it. pointer-events:none keeps the
     bloom from eating taps aimed at the arrow it sits under. */
  .arrowwrap{position:relative;width:132px;height:132px;margin:0 auto 30px;display:grid;place-items:center}
  .arrowwrap::before{
    content:"";position:absolute;width:132px;height:132px;border-radius:50%;
    background:radial-gradient(circle, rgba(216,186,104,.55) 0%, rgba(216,186,104,.18) 45%, transparent 72%);
    filter:blur(18px);pointer-events:none;
    animation:breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.75;transform:scale(1)}
    50%{opacity:1;transform:scale(1.08)}
  }

  /* The arrow IS the control. 112px is well past the 44px touch-target floor and the whole disc is
     tappable, not just the glyph. grid + place-items rather than `margin:0 auto` on the child —
     that centres horizontally only, and left the arrow riding high in the disc. */
  .arrowbtn{
    position:relative;z-index:1;
    display:grid;place-items:center;
    width:112px;height:112px;border:none;padding:0;cursor:pointer;
    border-radius:50%;
    background:linear-gradient(145deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);
    box-shadow:
      0 0 34px rgba(216,186,104,.45),
      0 14px 30px rgba(0,0,0,.55),
      inset 0 2px 0 rgba(255,255,255,.35);
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .arrowbtn:active{transform:scale(.96);box-shadow:0 0 22px rgba(216,186,104,.38),0 8px 18px rgba(0,0,0,.5)}
  .arrowbtn:focus-visible{outline:3px solid var(--gold-hi);outline-offset:5px}
  .arrowbtn svg{width:46px;height:46px;display:block}
  @media (prefers-reduced-motion:reduce){.arrowwrap::before{animation:none}}

  .later{margin-top:26px;display:none}
  /* The one remaining fallback. Outlined rather than filled so it reads as secondary to the arrow
     — same tap area, clearly not the main road. */
  .secondary{
    display:block;width:100%;padding:15px 20px;border-radius:100px;
    background:transparent;border:1px solid rgba(216,186,104,.38);
    color:var(--gold);font-family:inherit;font-size:15px;font-weight:600;
    text-decoration:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    transition:background .15s ease,border-color .15s ease;
  }
  .secondary:active{background:rgba(216,186,104,.10);border-color:rgba(216,186,104,.65)}
  .secondary:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
  .card[data-stage="hint"] .later,
  .card[data-preview="1"] .later{display:block}

  .note{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:20px}

  @media (max-width:480px){body{padding:20px}}
</style>
</head>
<body>

<main class="card" id="preCard">
  <h1>Tap to continue</h1>
  <p class="sub">Your reward page opens in your browser, where everything loads properly.</p>

  <!-- THE ARROW IS THE PRIMARY CONTROL, and it is an <a> carrying the real destination — not a
       decorative div with a click handler. That matters three ways:
         · href works with JS off, and a crawler reading this page sees the same lander a buyer gets
         · the tap supplies USER ACTIVATION, which is the whole reason this replaced the 250ms
           auto-fire: iOS honours a custom scheme far more readily from a real gesture than from a
           programmatic navigation it never asked for
         · it is one target, 112px, so there is nothing to misread and nothing to miss
       The spinner that used to sit here was removed on purpose — a spinner instructs the visitor to
       WAIT, and this page now needs them to ACT. -->
  <div class="arrowwrap">
  <a class="arrowbtn" id="preOpen" href="#" rel="noopener" aria-label="Open in my browser">
    <!-- Dark ink, not white. Measured through a canvas: white on this gold is 1.88:1, under the
         3:1 a graphical UI component needs and visibly washed out on a bright phone. Ink is
         10.5:1 on the same fill. -->
    <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0C" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M7 17L17 7"></path>
      <path d="M8 7h9v9"></path>
    </svg>
  </a>
  </div>
  <p class="sub" style="margin-bottom:0">Opens in Safari or Chrome</p>

  <!-- One fallback, not three. The hint paragraph and Copy link are gone: on a phone, "Copy link"
       asks the visitor to paste a URL somewhere themselves, which nobody does, and the hint was
       explaining a choice that no longer needs explaining now the arrow is the obvious primary.
       breakout.js guards every one of these lookups (`if (hint)`, `if (copy)`), so removing the
       elements is safe — it does not need a matching JS change to keep working. -->
  <div class="later" id="later">
    <a class="secondary" id="preStay" href="#">Continue here</a>
  </div>

  <p class="note" id="preNote"></p>
</main>

<!-- ttclid FIRST, and deliberately NOT async. It writes the _ttclid cookie synchronously at parse
     time, and breakout.js on the next line can location.replace() away within milliseconds — an
     async tag here is a race the cookie loses. Loading it on /pre banks the click id one hop
     EARLIER than the lander, so a hop that strips the query between here and the lander is still
     recoverable. -->
<script src="/js/ttclid.js"></script>
<script src="/js/breakout.js"></script>
</body>
</html>
