<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Domino's Gift Card Offer</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #ffffff;
        color: #222;
    }

    .header {
        background: #006491; /* Domino's Blue */
        padding: 26px 20px;
        text-align: center;
        color: #fff;
        font-size: 24px;
        font-weight: bold;
    }

    .subheader {
        text-align: center;
        font-size: 18px;
        color: #006491;
        margin-top: 10px;
        font-weight: bold;
    }

    .container {
        padding: 20px;
    }

    .pretty-box {
        background: #F7EEDB; /* Domino's beige */
        border-left: 6px solid #E31837; /* Domino's red accent */
        padding: 16px;
        border-radius: 10px;
        font-size: 16px;
        line-height: 1.45;
        color: #5A4632; /* Domino's brown */
        margin-bottom: 18px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .cta-button {
        width: 100%;
        background: #E31837; /* Domino's Red */
        color: #fff;
        padding: 16px;
        border-radius: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        margin-top: 25px;
        cursor: pointer;
        transition: 0.2s;
    }

    .cta-button:active {
        transform: scale(0.97);
        background: #c2122d;
    }

    .footer {
        text-align: center;
        padding: 20px;
        font-size: 13px;
        color: #777;
    }

    .offer-logo { display: block; width: 64px; height: 64px; border-radius: 16px; object-fit: cover; margin: 0 auto 12px; }
</style>
</head>

<body>

<div class="header"><img class="offer-logo" src="/images/dominos-logo.jpg" alt="Domino's" width="64" height="64">Domino's Gift Card</div>
<div class="subheader">Give the Gift of Pizza</div>

<div class="container">

    <!-- Pretty Box 1 -->
    <div class="pretty-box">
        And they’re fast and easy to send.
    </div>

    <!-- Pretty Box 2 -->
    <div class="pretty-box">
        Just pick a design, add your own personal message, email it — and you're done.
    </div>

    <!-- CTA Button -->
    <div class="cta-button" onclick="window.location.href = buildOfferUrl()">
        Give the Gift of Pizza
    </div>

</div>

<div class="footer">© 2026 Domino's Gift Card Offer</div>

<script>
/* THE RAW DESTINATION LINK — the offer row's default link, declared WITHOUT a trailing empty slot:
   the builder appends the param itself, and keeping both would put an EMPTY slot ahead of the
   real one, which the network reads first. */
var OFFER_LINK = 'https://montrk.co.uk/?a=26648&c=47858';

/* LINK-BUILD v5 — one param out: the affiliate code, nothing else. Self-contained on purpose:
   every value comes from location.search, so the shipped builder can be lifted out and executed
   on its own — which is exactly what the link guard does to prove this page. */
function buildOfferUrl() {
  var _p = new URLSearchParams(location.search);
  var _s1 = _p.get('s1') || _p.get('sub1') || _p.get('campid') || '';
  /* CODE-ONLY v1 — the network receives the CODE, never the whole wire. `|| _s1` keeps a value
     with NO code in it going out verbatim. */
  var _send1 = (String(_s1).match(/SPK-[0-9A-F]{4}-[0-9A-F]{4}(?:-\d+)?/i) || [''])[0].toUpperCase() || _s1;
  /* OUTBOUND PARAM IS `s1`: this destination family reads s1..s5 and silently discards sub1. */
  var _dest = !_send1 ? OFFER_LINK : OFFER_LINK + (OFFER_LINK.indexOf('?') > -1 ? '&' : '?') + 's1=' + encodeURIComponent(_send1);
  var _t = _p.get('ttclid') || '';
  if (/CLICK_ID|__CLICKID__|[{}\[\]#%]/i.test(_t)) _t = '';
  /* CLICK-STAMP v1 -- log the click at our own /click, then 302 to the offer unchanged. The gate's
     own `s1=` carries the FULL wire: that is our log, not the network's param. */
  return '/click?u=' + encodeURIComponent(_dest)
       + (_s1 ? '&s1=' + encodeURIComponent(_s1) : '')
       + '&lp=' + encodeURIComponent(location.pathname)
       + (_t ? '&t=' + encodeURIComponent(_t) : '');
}

/* BEACON v2 */
(function(){
  var BEACON = '/api/funnel-beacon';
  var bq = new URLSearchParams(location.search);
  function bsend(ev){
    try {
      navigator.sendBeacon(BEACON, new Blob([JSON.stringify({
        event: ev, sid: bq.get('sid') || '',
        s1: bq.get('s1') || '', s2: bq.get('s2') || '', s3: bq.get('s3') || '',
        ttclid: bq.get('ttclid') || '',
        slice: 'DOMINOSGIFTCARDCPAUS-SHANNONP-37', clone: 'US', path: location.pathname
      })], { type: 'text/plain' }));
    } catch (e) {}
  }
  bsend('lp_view');
  var fired = false;
  document.addEventListener('click', function(e){
    if (fired) return;
    var el = e.target && e.target.closest ? e.target.closest('.cta-button') : null;
    if (el) { fired = true; bsend('offer_click'); }
  }, true);
})();
</script>
</body>
</html>
