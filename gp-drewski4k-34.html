/* THE RAW DESTINATION LINK — the offer row's US link, declared WITHOUT a trailing empty slot:
   the builder appends the param itself, and keeping both would put an EMPTY slot ahead of the
   real one, which the network reads first. */
var OFFER_LINK = 'https://monetisetrk2.co.uk/?a=26648&c=56278';

/* LINK-BUILD v5 — one param out: the affiliate code, nothing else. Self-contained on purpose:
   every value comes from location.search, so the shipped builder can be lifted out and executed
   on its own — which is exactly what the link guard does to prove this page. */
function buildOfferUrl() {
  var _p = new URLSearchParams(location.search);
  var _s1 = _p.get('s1') || _p.get('sub1') || _p.get('campid') || '';
  /* CODE-ONLY v1 — the network receives the CODE, never the whole wire. `|| _s1` keeps a value
     with NO code in it going out verbatim. */
  var _send1 = (String(_s1).match(/SPK-[0-9A-F]{4}-[0-9A-F]{4}(?:-\d+)?/i) || [''])[0].toUpperCase() || _s1;
  /* OUTBOUND PARAM IS `s1`: this destination family reads s1..s5 and silently discards sub1. */
  var _dest = !_send1 ? OFFER_LINK : OFFER_LINK + (OFFER_LINK.indexOf('?') > -1 ? '&' : '?') + 's1=' + encodeURIComponent(_send1);
  var _t = _p.get('ttclid') || '';
  if (/CLICK_ID|__CLICKID__|[{}\[\]#%]/i.test(_t)) _t = '';
  /* CLICK-STAMP v1 -- log the click at our own /click, then 302 to the offer unchanged. The gate's
     own `s1=` carries the FULL wire: that is our log, not the network's param. */
  return '/click?u=' + encodeURIComponent(_dest)
       + (_s1 ? '&s1=' + encodeURIComponent(_s1) : '')
       + '&lp=' + encodeURIComponent(location.pathname)
       + (_t ? '&t=' + encodeURIComponent(_t) : '');
}

/* BEACON v2 */
(function(){
  var BEACON = '/api/funnel-beacon';
  var bq = new URLSearchParams(location.search);
  function bsend(ev){
    try {
      navigator.sendBeacon(BEACON, new Blob([JSON.stringify({
        event: ev, sid: bq.get('sid') || '',
        s1: bq.get('s1') || '', s2: bq.get('s2') || '', s3: bq.get('s3') || '',
        ttclid: bq.get('ttclid') || '',
        slice: 'GP-DREWSKI4K-34', clone: 'US', path: location.pathname
      })], { type: 'text/plain' }));
    } catch (e) {}
  }
  bsend('lp_view');
  var fired = false;
  document.addEventListener('click', function(e){
    if (fired) return;
    var el = e.target && e.target.closest ? e.target.closest('button.cta, button.add, button.unlock') : null;
    if (el) { fired = true; bsend('offer_click'); }
  }, true);
})();

        .top .tile{width:38px;height:38px}
        .wordmark{font-size:21px;font-weight:800;letter-spacing:-.045em;color:#fff;margin-right:auto}
        .live{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
          background:rgba(109,230,169,.10);border:1px solid var(--line2);white-space:nowrap;
          font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mint)}
        .live i{width:6px;height:6px;border-radius:50%;background:var(--mint);animation:dot 1.7s ease-in-out infinite}
        @keyframes dot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(109,230,169,.6)}55%{opacity:.35;box-shadow:0 0 0 6px rgba(109,230,169,0)}}
        .live b{color:#fff;font-variant-numeric:tabular-nums}

        .hero{padding:26px 4px 6px;text-align:center}
        h1{font-size:43px;line-height:.96;font-weight:900;letter-spacing:-.045em;margin-bottom:14px}
        h1 .a{display:block;color:#fff}
        h1 .b{display:block;
          background:linear-gradient(100deg,var(--mint3) 18%,#fff 40%,var(--mint) 56%,var(--mint3) 78%);
          background-size:250% 100%;-webkit-background-clip:text;background-clip:text;
          -webkit-text-fill-color:transparent;color:transparent;animation:shine 6s linear infinite}
        @keyframes shine{0%{background-position:130% 0}100%{background-position:-130% 0}}
        .lede{font-size:15px;line-height:1.55;color:var(--muted);max-width:340px;margin:0 auto}

        .divl{display:flex;align-items:center;gap:11px;margin:30px 0 14px}
        .divl::before,.divl::after{content:'';flex:1;height:1px;background:var(--line)}
        .divl span{font-size:10.5px;font-weight:800;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}

        .rank{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:17px;margin-bottom:11px;
          background:var(--surf2);border:1px solid var(--line);transition:border-color .45s,background .45s,box-shadow .45s}
        .rpill{flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;
          font-size:14px;font-weight:900;letter-spacing:-.01em;color:#0b1b13;
          background:linear-gradient(150deg,#5d6d65,#3b4740)}
        .rpill svg{width:15px;height:15px;flex:none}
        .rtx{flex:1;min-width:0;text-align:right}
        .rtx b{display:block;font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
        .rtx span{display:block;font-size:12px;font-weight:700;line-height:1.35;margin-top:3px;color:var(--muted)}
        .rank.act{background:linear-gradient(180deg,rgba(109,230,169,.11),var(--surf2));border-color:var(--line2);
          box-shadow:0 0 22px rgba(109,230,169,.13)}
        .rank.act .rpill{background:linear-gradient(150deg,var(--mint3),var(--mint2));animation:ring 2.3s ease-out infinite}
        .rank.act .rtx span{color:var(--mint)}
        @keyframes ring{0%{box-shadow:0 0 0 0 rgba(109,230,169,.55)}100%{box-shadow:0 0 0 13px rgba(109,230,169,0)}}
        .rank.gold.act{background:linear-gradient(180deg,rgba(245,200,107,.12),var(--surf2));
          border-color:rgba(245,200,107,.32);box-shadow:0 0 22px rgba(245,200,107,.14)}
        .rank.gold.act .rpill{background:linear-gradient(150deg,#ffe6ad,var(--gold));color:#3a2a05;animation:ringg 2.3s ease-out infinite}
        .rank.gold.act .rtx span{color:var(--gold)}
        @keyframes ringg{0%{box-shadow:0 0 0 0 rgba(245,200,107,.55)}100%{box-shadow:0 0 0 13px rgba(245,200,107,0)}}

        .card{background:linear-gradient(180deg,var(--surf),var(--surf2));border:1px solid var(--line);
          border-radius:22px;overflow:hidden}
        .balhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 14px}
        .blab{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.16em;
          text-transform:uppercase;color:var(--muted);margin-bottom:5px}
        .blab i{width:6px;height:6px;border-radius:50%;background:var(--mint)}
        .bal{font-size:34px;font-weight:900;letter-spacing:-.035em;line-height:1;color:#fff;
          font-variant-numeric:tabular-nums;transition:transform .19s ease,color .19s ease}
        .bal.pop{transform:scale(1.11);color:var(--mint)}
        .bal em{font-style:normal;font-size:13px;font-weight:700;color:var(--muted);margin-left:4px;letter-spacing:0}
        .rate{flex:none;display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:999px;
          background:rgba(109,230,169,.10);border:1px solid var(--line2);
          font-size:12px;font-weight:900;color:var(--mint);white-space:nowrap}
        .simrow{display:flex;gap:14px;padding:0 16px 16px;align-items:flex-start}

        .phone{flex:none;width:44%;max-width:150px;aspect-ratio:9/16;max-height:236px;position:relative;
          border-radius:17px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#0a1410}
        .track{position:absolute;inset:0;transition:transform .55s cubic-bezier(.6,0,.2,1)}
        .track.nojump{transition:none}
        .clip{position:absolute;left:0;right:0;height:100%;overflow:hidden}
        .clip .bgv{position:absolute;inset:0}
        .clip .bgv::before,.clip .bgv::after{content:'';position:absolute;border-radius:50%;filter:blur(16px)}
        .clip .bgv::before{width:130%;height:55%;left:-20%;top:8%;opacity:.85}
        .clip .bgv::after{width:110%;height:48%;right:-25%;bottom:4%;opacity:.6}
        .c0 .bgv{background:linear-gradient(165deg,#123a2c,#071a12)}
        .c0 .bgv::before{background:#2fd08a}.c0 .bgv::after{background:#0f6b48}
        .c1 .bgv{background:linear-gradient(165deg,#1a2f43,#08131c)}
        .c1 .bgv::before{background:#3aa8d8}.c1 .bgv::after{background:#14526e}
        .c2 .bgv{background:linear-gradient(165deg,#3a2340,#150a19)}
        .c2 .bgv::before{background:#a05fd0}.c2 .bgv::after{background:#5b2a78}
        .clip .scrim{position:absolute;inset:0;
          background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 28%,transparent 46%,rgba(0,0,0,.72) 100%)}
        .tag{position:absolute;top:8px;left:8px;font-size:8px;font-weight:900;letter-spacing:.11em;
          text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);border-radius:5px;padding:4px 6px;
          backdrop-filter:blur(3px)}
        .rail{position:absolute;right:6px;bottom:44px;display:flex;flex-direction:column;align-items:center;gap:9px}
        .rail div{display:flex;flex-direction:column;align-items:center;gap:1px;color:#fff;
          filter:drop-shadow(0 1px 3px rgba(0,0,0,.75))}
        .rail svg{width:17px;height:17px}
        .rail b{font-size:9px;font-weight:800;font-variant-numeric:tabular-nums}
        .who{position:absolute;left:8px;right:34px;bottom:12px}
        .who .u{display:flex;align-items:center;gap:6px}
        .who .av{width:18px;height:18px;border-radius:50%;flex:none;border:1.5px solid rgba(255,255,255,.85);
          background:linear-gradient(145deg,var(--mint3),#2b9c8f)}
        .who .h{font-size:11px;font-weight:800;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
        .who .cap{height:3px;border-radius:2px;background:rgba(255,255,255,.4);margin-top:6px;width:78%}
        .who .cap+.cap{width:50%;margin-top:3px}
        .prog{position:absolute;left:0;right:0;bottom:0;height:2.5px;background:rgba(255,255,255,.16)}
        .prog i{display:block;height:100%;background:var(--mint);width:0;animation:fill 2.6s linear infinite}
        @keyframes fill{from{width:0}to{width:100%}}
        .coin{position:absolute;left:50%;bottom:26%;transform:translateX(-50%);font-size:16px;font-weight:900;
          color:var(--mint);pointer-events:none;opacity:0;z-index:5;text-shadow:0 0 14px rgba(109,230,169,.8)}
        .coin.fly{animation:coinUp 1.05s cubic-bezier(.22,1,.36,1)}
        @keyframes coinUp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}
          18%{opacity:1}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-92px) scale(1.25)}}

        .simtx{flex:1;min-width:0;padding-top:4px}
        .simtx h3{font-size:19px;font-weight:900;letter-spacing:-.03em;line-height:1.16;margin-bottom:8px}
        .simtx h3 em{font-style:normal;color:var(--mint)}
        .simtx p{font-size:12.5px;line-height:1.55;color:var(--muted)}
        .simtx p b{color:var(--ink);font-weight:800}
        .simfoot{padding:11px 16px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;
          background:rgba(109,230,169,.05);border-top:1px solid var(--line2)}
        .simfoot b{color:var(--mint)}

        .cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;
          border:none;border-radius:16px;cursor:pointer;font-family:inherit;font-size:17px;font-weight:900;
          letter-spacing:-.015em;color:#04231a;text-decoration:none;position:relative;overflow:hidden;
          background:linear-gradient(150deg,var(--mint3),var(--mint2));
          transition:transform .12s ease;animation:pulse 2.4s ease-in-out infinite}
        .cta:active{transform:scale(.975)}
        @keyframes pulse{0%,100%{box-shadow:0 6px 22px rgba(109,230,169,.32)}50%{box-shadow:0 10px 38px rgba(109,230,169,.6)}}
        .cta::after{content:'';position:absolute;top:0;bottom:0;width:42%;pointer-events:none;
          background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
          left:-50%;animation:sweep 3.3s ease-in-out infinite}
        @keyframes sweep{0%{left:-50%}60%,100%{left:120%}}
        .cta svg{width:20px;height:20px;flex:none}
        .note{margin-top:9px;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.09em;
          text-transform:uppercase;color:var(--muted)}

        h2{font-size:27px;font-weight:900;letter-spacing:-.035em;text-align:center;margin-bottom:16px}
        h2 em{font-style:normal;color:var(--mint)}
        .step{display:flex;gap:12px;padding:14px;border-radius:17px;background:var(--surf2);
          border:1px solid var(--line);margin-bottom:10px}
        .sn{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;
          font-size:14px;font-weight:900;color:var(--mint);background:rgba(109,230,169,.12);border:1px solid var(--line2)}
        .sb{flex:1;min-width:0}
        .sb b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.015em;margin-bottom:4px}
        .sb span{display:block;font-size:13px;line-height:1.5;color:var(--muted)}
        .pass{display:flex;align-items:center;gap:11px;padding:13px;border-radius:17px;margin-bottom:10px;
          background:linear-gradient(180deg,rgba(109,230,169,.09),var(--surf2));border:1px solid var(--line2)}
        .pass .tile{width:46px;height:46px;border-radius:13px}
        .pi{flex:1;min-width:0}
        .pi b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.015em}
        .pi span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .pi em{font-style:normal;color:var(--ink);font-weight:800}
        .stars{color:var(--gold);letter-spacing:.4px}
        .add{flex:none;border:none;cursor:pointer;font-family:inherit;border-radius:999px;padding:10px 18px;
          font-size:12.5px;font-weight:900;letter-spacing:.05em;color:#04231a;
          background:linear-gradient(150deg,var(--mint3),var(--mint2))}
        .payrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
        .payrow span{font-size:11px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.04);
          border:1px solid var(--line);border-radius:9px;padding:6px 10px}

        .games{padding:18px 16px 20px;position:relative}
        .games h3{font-size:19px;font-weight:900;letter-spacing:-.03em;line-height:1.25;margin-bottom:14px}
        .games h3 em{font-style:normal;color:var(--mint)}
        .grid{display:flex;gap:10px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
        .gtile{flex:none;width:88px;text-align:center;position:relative}
        .gtile .im{position:relative;width:88px;height:88px;border-radius:19px;overflow:hidden;background:#101a14;
          border:1px solid var(--line)}
        .gtile img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) brightness(.52)}
        .gtile .lk{position:absolute;right:5px;bottom:5px;width:20px;height:20px;border-radius:50%;
          background:rgba(0,0,0,.68);display:grid;place-items:center;backdrop-filter:blur(3px)}
        .gtile .lk svg{width:11px;height:11px}
        .gtile b{display:block;margin-top:7px;font-size:11px;font-weight:700;color:var(--muted)}
        .unlock{position:absolute;left:50%;top:calc(50% + 8px);transform:translate(-50%,-50%);
          display:inline-flex;align-items:center;gap:7px;padding:13px 24px;border-radius:999px;border:none;
          cursor:pointer;font-family:inherit;font-size:14px;font-weight:900;letter-spacing:.06em;color:#04231a;
          background:linear-gradient(150deg,var(--mint3),var(--mint2));white-space:nowrap;z-index:3;
          animation:pulse 2.4s ease-in-out infinite}
        .unlock:active{transform:translate(-50%,-50%) scale(.97)}
        .unlock svg{width:14px;height:14px}

        .closer{text-align:center;padding:26px 4px 6px}
        .closer p{font-size:14px;line-height:1.6;color:var(--muted);max-width:330px;margin:0 auto 18px}
        .legal{padding:24px 6px 10px;font-size:10.5px;line-height:1.65;color:#5f7169;text-align:center}
        .legal a{color:var(--muted);text-decoration:none}
        .legal .cr{margin-top:10px}

        .dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:50;
          padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:rgba(5,10,8,.94);
          backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line2)}
        .drow{display:flex;align-items:center;gap:10px;margin-bottom:9px;overflow:hidden}
        .drow .tile{width:44px;height:44px;border-radius:13px}
        .dmid{flex:1 1 auto;min-width:0}
        .dr1{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
        .dr1 b{font-size:16px;font-weight:800;letter-spacing:-.04em;color:#fff}
        .chip{flex:none;font-size:9.5px;font-weight:800;color:var(--mint);background:rgba(109,230,169,.11);
          border:1px solid var(--line2);border-radius:6px;padding:3px 7px;white-space:nowrap}
