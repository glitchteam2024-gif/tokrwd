<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hello World</title>

<script>
  // Watch the pixel script tag the snippet just inserted: 'load' = TikTok's pixel is running,
  // 'error' = the browser (usually an ad blocker) refused to load it, so nothing reaches TikTok.
  (function () {
    window.__pixelState = 'loading';
    var s = document.querySelector('script[src*="analytics.tiktok.com/i18n/pixel/events.js"]');
    if (!s) { window.__pixelState = 'missing'; return; }
    function set(state) { window.__pixelState = state; document.dispatchEvent(new Event('pixelstate')); }
    s.addEventListener('load', function () { set('loaded'); });
    s.addEventListener('error', function () { set('blocked'); });
  })();
</script>

<style>
  :root {
    --bg: #0e0d0b;
    --panel: #171512;
    --line: #2a2620;
    --text: #f1ece2;
    --muted: #9a9181;
    --gold: #c9a86a;
    --gold-ink: #1a1508;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 120px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  section[hidden] { display: none; }
  h1 { font-size: clamp(36px, 9vw, 56px); line-height: 1.05; margin: 0 0 12px; letter-spacing: -0.02em; }
  h2 { font-size: clamp(26px, 6vw, 34px); line-height: 1.15; margin: 0 0 24px; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0 0 28px; }
  .row { display: flex; gap: 12px; justify-content: center; }
  button {
    font: inherit;
    font-weight: 600;
    border-radius: 10px;
    padding: 14px 28px;
    min-width: 140px;
    cursor: pointer;
    border: 1px solid var(--gold);
    background: var(--gold);
    color: var(--gold-ink);
    transition: transform .08s ease, filter .15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.98); }
  h2:focus { outline: none; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  button.ghost { background: transparent; color: var(--gold); }
  .link { background: none; border: 0; color: var(--muted); min-width: 0; padding: 8px; font-weight: 500; text-decoration: underline; }

  /* Small on-page log so you can see each pixel event as it fires. */
  #log {
    position: fixed; left: 16px; right: 16px; bottom: 16px;
    max-width: 440px; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
    max-height: 30vh; overflow: auto; text-align: left;
  }
  #log b { color: var(--text); font-weight: 600; }
  #status.ok { color: #8fbf7f; }
  #status.bad { color: #d98b6f; }
  #log ol { margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body>
<main>
  <section id="step-hello">
    <h1>Hello World</h1>
    <p>Just a quick one.</p>
    <button type="button" id="btn-continue">Continue</button>
  </section>

  <section id="step-question" hidden>
    <h2 tabindex="-1">Are you having a good day?</h2>
    <div class="row">
      <button type="button" data-answer="yes">Yes</button>
      <button type="button" class="ghost" data-answer="no">No</button>
    </div>
  </section>

  <section id="step-thanks" hidden>
    <h2 tabindex="-1" id="thanks-title">Thanks!</h2>
    <p id="thanks-body">Appreciate you letting us know.</p>
    <button type="button" class="link" id="btn-restart">Start over</button>
  </section>
</main>

<div id="log" aria-live="polite">
  <div>Pixel: <span id="status">loading…</span></div>
  <ol id="events"></ol>
</div>

<script>
(function () {
  var statusEl = document.getElementById('status');
  var eventsEl = document.getElementById('events');

  function logLine(name, detail) {
    var li = document.createElement('li');
    var b = document.createElement('b');
    b.textContent = name;
    li.appendChild(b);
    li.appendChild(document.createTextNode(' ' + (detail || '')));
    eventsEl.appendChild(li);
    eventsEl.parentNode.scrollTop = eventsEl.parentNode.scrollHeight;
  }

  // Unique id per event, so these can be de-duplicated against the Events API later.
  function eventId(name) {
    return name + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  }

  function track(name, props) {
    ttq.track(name, props, { event_id: eventId(name) });
    logLine(name, (props.content_name || '') + (props.value != null ? ' ($' + props.value.toFixed(2) + ' ' + props.currency + ')' : ''));
  }

  function renderStatus() {
    var st = window.__pixelState;
    if (st === 'loaded') { statusEl.textContent = 'loaded — events are going to TikTok (DAUOGKRC77UE17RKVTFG)'; statusEl.className = 'ok'; }
    else if (st === 'blocked') { statusEl.textContent = 'BLOCKED by this browser (ad blocker / tracking protection) — events are NOT reaching TikTok'; statusEl.className = 'bad'; }
    else if (st === 'missing') { statusEl.textContent = 'pixel script not found on the page'; statusEl.className = 'bad'; }
    else { statusEl.textContent = 'loading…'; statusEl.className = ''; }
  }
  document.addEventListener('pixelstate', renderStatus);
  renderStatus();

  logLine('PageView', '(ttq.page)');

  function show(id) {
    ['step-hello', 'step-question', 'step-thanks'].forEach(function (s) {
      document.getElementById(s).hidden = (s !== id);
    });
    var heading = document.querySelector('#' + id + ' h2');
    if (heading) heading.focus();
  }

  // 1. Landed on the page.
  track('ViewContent', { content_name: 'Hello World', content_category: 'pixel_test', description: 'Landing page view' });

  // 2. Continue.
  document.getElementById('btn-continue').addEventListener('click', function () {
    track('ClickButton', { content_name: 'Continue', content_category: 'pixel_test' });
    track('Lead', { content_name: 'Continue', content_category: 'pixel_test', description: 'Hello World lead' });
    show('step-question');
  });

  // 3. Yes / No.
  Array.prototype.forEach.call(document.querySelectorAll('[data-answer]'), function (btn) {
    btn.addEventListener('click', function () {
      var answer = btn.getAttribute('data-answer');
      var label = answer === 'yes' ? 'Yes' : 'No';
      track('ClickButton', { content_name: 'Good day: ' + label, content_category: 'pixel_test' });
      track('SubmitForm', { content_name: 'Good day survey', content_category: 'pixel_test', description: answer });
      // Sales conversion. value + currency are what TikTok needs to count revenue.
      track('Purchase', {
        content_name: 'Good day survey',
        content_type: 'product',
        content_id: 'pixel_test_' + answer,
        contents: [{ content_id: 'pixel_test_' + answer, content_type: 'product', content_name: 'Pixel test (' + label + ')', quantity: 1, price: 1.00 }],
        quantity: 1,
        value: 1.00,
        currency: 'USD',
        description: answer
      });

      document.getElementById('thanks-title').textContent = answer === 'yes' ? 'Thanks — glad to hear it!' : 'Thanks — hope it gets better.';
      show('step-thanks');

      // 4. Reached the thank-you step.
      track('CompleteRegistration', { content_name: 'Thanks', content_category: 'pixel_test', description: answer });
    });
  });

  document.getElementById('btn-restart').addEventListener('click', function () {
    show('step-hello');
    document.getElementById('btn-continue').focus();
  });
})();
</script>
</body>
</html>
