<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#0B0F14;font-family:'Archivo',system-ui,sans-serif;color:#fff;padding:26px 30px}
.hd{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#6B7280;margin:0 0 8px}
.rule{height:1px;background:linear-gradient(90deg,rgba(216,186,104,.30),rgba(255,255,255,.05) 42%,transparent);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,258px);gap:14px}
.oc{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#14181F,#0D1117);border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.oc-media{position:relative;aspect-ratio:16/9;overflow:hidden;background:#090C11}
.oc-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.oc-scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(6,9,13,.62) 0%,transparent 24%),linear-gradient(155deg,rgba(6,9,13,.78) 0%,rgba(6,9,13,.26) 22%,transparent 44%)}
.oc-veil{position:absolute;inset:0;width:100%;height:100%;display:block}
.oc-spine{position:absolute;right:0;bottom:0;width:34%;display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding:0 11px 11px 0}
.oc-badge{position:absolute;top:10px;left:10px}
.chip{display:inline-flex;padding:3px 9px;border-radius:7px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.62);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.55)}
.chip.new{border-color:rgba(216,186,104,.3);color:#E5D19A}
.oc-foot{padding:10px 12px 11px}
.oc-name{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-terms{display:flex;align-items:baseline;justify-content:space-between;margin-top:5px}
.oc-cat{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#6B7280}
.oc-pay{font-family:'JetBrains Mono',monospace;font-size:15.5px;font-weight:700;color:#E5D19A;text-shadow:0 0 18px rgba(216,186,104,.2)}
.flag{width:22px;height:16px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="sprkVeil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#080B10" stop-opacity=".60"/><stop offset=".34" stop-color="#080B10" stop-opacity=".93"/><stop offset="1" stop-color="#080B10" stop-opacity=".99"/></linearGradient>
<linearGradient id="sprkEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8BA68" stop-opacity="0"/><stop offset=".2" stop-color="#E5D19A" stop-opacity=".9"/><stop offset=".52" stop-color="#D8BA68" stop-opacity=".5"/><stop offset=".8" stop-color="#E5D19A" stop-opacity=".85"/><stop offset="1" stop-color="#D8BA68" stop-opacity="0"/></linearGradient>
</defs></svg>
<div class="hd">Generated plates, in the real tile</div><div class="rule"></div>
<div class="grid" id="g"></div>
<script>
const CARDS = __CARDS__;
const VEIL = `<svg class="oc-veil" viewBox="0 0 160 90" preserveAspectRatio="none">
 <path d="M118,0 C118,14 130,20 130,31 C130,44 100,49 100,62 C100,74 112,79 112,90 L160,90 L160,0 Z" fill="url(#sprkVeil)"/>
 <path d="M118,0 C118,14 130,20 130,31 C130,44 100,49 100,62 C100,74 112,79 112,90" fill="none" stroke="url(#sprkEdge)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>`;
g.innerHTML = CARDS.map(o => `<div class="oc"><div class="oc-media">
  <img class="oc-art" src="${o.src}"><div class="oc-scrim"></div>${VEIL}
  <div class="oc-badge"><span class="chip ${o.chip==='New'?'new':''}">${o.chip}</span></div>
  <div class="oc-spine">${o.geo.map(c=>`<img class="flag" src="https://flagcdn.com/w40/${c}.png">`).join('')}</div>
  </div><div class="oc-foot"><div class="oc-name">${o.name}</div>
  <div class="oc-terms"><div class="oc-cat">${o.cat}</div><div class="oc-pay">${o.pay}</div></div></div></div>`).join('');
</script>
</body></html>
