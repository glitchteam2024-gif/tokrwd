<!-- ?lg=<GEO> — the AFFILIATE'S GEO SELECTOR. Runs FIRST, in the head: before the pixel fires,
     before the body paints, and before the CTA is wired. Ordering is load-bearing — running this
     late double-counted the TikTok PageView (one on the page being left, one on the page being
     entered) and left a window where a fast tap fired the CTA on the WRONG geo's door.
     Keeps the clone index (/AK50/GB7?lg=AU -> /AK50/AU7) so the URL footprint stays spread.
     NOT CLOAKING: keyed on an explicit query param, never the user agent, identical for crawlers. -->
<script>
(function(){
  var GEOS = ["US"], THIS_GEO = "US";
  var q = new URLSearchParams(location.search);
  var want = (q.get('lg') || '').trim().toUpperCase();
  if (want === 'UK') want = 'GB';
  if (!want || want === THIS_GEO || GEOS.indexOf(want) === -1) return;
  var re = new RegExp('(^|/)' + THIS_GEO + '([0-9]*)(/index[.]html|/)?$');
  var next = location.pathname.replace(re, function (_m, pre, idx, tail) { return pre + want + idx + (tail || ''); });
  if (next === location.pathname) return;
  q.set('lg', want);
  location.replace(next + '?' + q.toString() + location.hash);
})();
</script>

/* Hallmark · macrostructure: Marquee Hero · tone: utilitarian · anchor hue: lime/teal

 * genre: modern-minimal · theme: custom (ember, from images/offers/FL221322.webp)

:root{
  /* ── Type ─────────────────────────────────────────────────────────────── */
  --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;

  /* ── 4pt spacing scale ────────────────────────────────────────────────── */
  --space-2xs: 0.25rem;
  --space-xs:  0.5rem;
  --space-sm:  0.75rem;
  --space-md:  1rem;
  --space-lg:  1.5rem;
  --space-xl:  2rem;
  --space-2xl: 3rem;

  /* ── Type scale ───────────────────────────────────────────────────────── */
  --text-xs:      0.7rem;
  --text-sm:      0.8rem;
  --text-base:    0.92rem;
  --text-lg:      1.1rem;
  --text-xl:      1.4rem;
  --text-2xl:     1.9rem;
  /* 3xl is the wallet-pass primary field. Sized to a real PKPass primary value (~36–42pt), which
     lands between 2xl and display — the display rung would swallow the pass it sits inside. */
  --text-3xl:     2.6rem;
  --text-display: 4rem;

  /* ── Motion. Three named easings; never the bare `ease`. ──────────────── */
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast:    140ms;
  --dur-base:    220ms;

  /* ── Shape ────────────────────────────────────────────────────────────── */
  --radius-sm:  4px;
  /* Wallet-pass corner. A real pass is far rounder than a UI card; 4px reads as a <div>. */
  --radius-lg:  20px;
  --radius-pill: 980px;
  --rule-hair:  1px;

  /* Alpha-only, used inside mask-image. Tokenised so no raw colour literal ships (gate 48). */
  --mask-solid: rgb(0 0 0);
  --color-paper:    oklch(16% 0.006 150);
  --color-paper-2:  oklch(22% 0.008 150);
  --color-ink:      oklch(98% 0 0);
  --color-ink-2:    oklch(72% 0.012 150);
  --color-rule:     oklch(30% 0.008 150);
  --color-accent:   oklch(87% 0.17 120);   /* lime — the ember's warm end */
  --color-accent-2: oklch(62% 0.07 178);   /* teal — the ember's cool end */
  --color-on-accent: oklch(16% 0.006 150);
  --color-focus:    oklch(87% 0.17 120);
  /* Accent as SMALL TEXT on the paper (the step numerals). On ember the accent is already a
     near-white lime and measures 13.51 on the near-black paper, so this is simply the accent. */
  --color-accent-on-paper: oklch(87% 0.17 120);

  /* ── Wallet pass (structure D) ────────────────────────────────────────────
     ELEVATION BY LIGHTNESS, NOT SHADOW. On a dark surface a box-shadow leaves a soft halo, which
     is the "shadow-glow on dark" tell; a lime-tinted one would be worse. The pass reads as raised
     because it is lighter than the paper, and the stack behind it recedes because it is dimmer. */
  --color-pass:     oklch(26% 0.010 150);
  --color-pass-2:   oklch(21% 0.008 150);
  /* Specular face. One low-opacity wash across the top-left — not a gradient background, not
     frosted glass. It is what makes the surface read as a physical card. */
  --sheen:          oklch(100% 0 0 / 0.055);
  /* Shown when no pass art is supplied. Deliberately the tile's own lime->teal + halftone rather
     than a grey box: an empty strip should look like part of the design, not a missing asset. */
  --strip-fallback: linear-gradient(118deg, oklch(87% 0.17 120 / 0.38), oklch(62% 0.09 178 / 0.55));
  --strip-dots:     oklch(87% 0.17 120 / 0.20);
}
*{margin:0;padding:0;box-sizing:border-box}
/* gate 34 — never `hidden` on the root. `clip` where supported, `hidden` as the iOS<16 fallback. */
html,body{overflow-x:hidden}

/* gate 51 — display type must break inside a long word rather than push the page wide. */

/* Focus ring: visible, >=3:1, and NEVER animated in. */

.page{min-height:100svh;display:flex;align-items:flex-start;justify-content:center;

.pill{display:inline-flex;align-items:center;gap:var(--space-2xs);font-size:var(--text-xs);

  animation:pulse 1.8s var(--ease-in-out) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* Social proof — renders ONLY when the middleware supplies real values. Never baked in. */
.stats{display:flex;background:var(--color-paper-2);border-radius:var(--radius-sm);
  margin:var(--space-lg) 0;overflow:hidden}
.stats[hidden]{display:none}

/* ── The card ────────────────────────────────────────────────────────────────
   The image IS the card. There is no drawn pass around it — no header, no status pill, no
   primary field, no perforation, no field row. Migi's brief, third pass: "the entire thing get
   rid of it and only show the image." Anything redrawn around a real card face competes with it.

   width/height come off the actual file at build time and the CSS is width:100%;height:auto, so
   the browser reserves the exact box before the image lands — no layout shift, whatever the
   aspect ratio of the art happens to be.

   border-radius clips the source's own white corner margin. --radius-lg is deliberately a little
   rounder than the card's own corner, so the white cannot peek out at any width. */
/* No .art element on this structure. The other three carry the tile's halftone arc as a page
   background; behind a real card face it just read as stray dots. The arc CSS still ships (it is
   shared) but nothing matches it here. */
.cardwrap{border-radius:var(--radius-lg);overflow:hidden}
/* The placeholder paints ONLY when there is no art. Putting it on .cardwrap unconditionally meant
   a green halftone box flashed on every cold load and was then covered by the card — the worst
   possible first frame on paid traffic. It also holds a card-shaped box so page height is stable. */
.cardwrap--empty{aspect-ratio:1.59;
  background-image:radial-gradient(circle at center,var(--strip-dots) 1.1px,transparent 1.2px),
    var(--strip-fallback);
  background-size:13px 13px,auto}
.cardimg{display:block;width:100%;height:auto}
.cardimg[hidden]{display:none}

/* ── Below the card ──────────────────────────────────────────────────────────
   Marquee Hero's divider axis: a thick rule at the turn. Left-aligned, not full width — it keeps
   the page off a single centred axis (gate 6) now that the card owns the middle. */
.turn{width:2.5rem;height:3px;background:var(--color-accent);margin:var(--space-xl) 0 var(--space-md)}
h1{font-size:var(--text-xl);font-weight:800;line-height:1.2;letter-spacing:-.02em;
  margin-bottom:var(--space-xs)}
.step{display:flex;gap:var(--space-sm);align-items:flex-start;padding:var(--space-sm) 0;
  border-top:var(--rule-hair) solid var(--color-rule)}
.step:first-of-type{border-top:none}
/* --color-accent-on-paper, NOT --color-accent: an 11px numeral in a hairline ring is small text
   and needs 4.5:1. Plain rose measures 2.78:1 on blush. See the token's note in tokens.css. */
.step-n{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;display:grid;place-items:center;

.cta{margin-top:var(--space-lg)}
</style>

<script>
/* Card art, in precedence order:
     1. window.__PASS_ART__ — server/middleware injection, same idiom as __DOOR_URL__
     2. the build-time `art` value, already baked into the src attribute above
     3. nothing — the wrapper's own halftone shows and NO image request is made
   onerror hides it rather than parking a broken-image glyph on the one screen that has to
   convert; the wrapper keeps a card-shaped box underneath either way. */
(function(){
  var el = document.getElementById('passArt');
  if (!el) return;
  el.addEventListener('error', function(){
    el.hidden = true;
    var w = el.parentNode; if (w) w.className += ' cardwrap--empty';
  });
  var override = window.__PASS_ART__;
  if (override) { el.src = override; el.hidden = false; }
})();

<script>
(function(){
'use strict';

/* bfcache bust */
window.addEventListener('pageshow', function(e){ if (e.persisted) location.reload(); });
if (window.performance && performance.navigation && performance.navigation.type === 2) location.reload();

var DOOR      = window.__DOOR_URL__ || 'https://sprktrax.org/api/link/applepay750-us-d';
/* Amount is baked into the markup at build time — nothing to substitute at runtime. */
var GEO_VALUE = 750;

/* optional social proof — only if the middleware supplied real values */
(function(){
  var s = window.__STATS__;
  if (!s || !s.length) return;
  var bar = document.getElementById('statsBar');
  if (!bar) return;
  bar.innerHTML = s.map(function(){
    return '<div class="stat"><div class="stat-val"></div><div class="stat-lbl"></div></div>';
  }).join('');
  [].forEach.call(bar.querySelectorAll('.stat'), function(el, i){
    el.querySelector('.stat-val').textContent = String(s[i].value);
    el.querySelector('.stat-lbl').textContent = String(s[i].label);
  });
  bar.hidden = false;
})();

/* ------------------------------------------------------------------
   FORWARD EVERY INCOMING PARAM to the door — the tokrwd lander contract.
   Inbound the launcher sets s1=<SPK> (the attribution key), s2=<publisher>,
   s3=<ad account>, s4, ttclid. The door re-stamps outbound (s1 -> bare
   affiliate id, s2 -> SPK, s3 forwarded, s4 -> offer name, click_id -> s5).
   An earlier draft whitelisted only utm_campaign/ttclid/s1, which silently
   dropped s3 — the ad-account leg — on every click.

   s1 is the AFFILIATE'S SPARK CODE and nothing else. Never overwrite it with
   a campaign name — that is what breaks attribution.
   ------------------------------------------------------------------ */
var q = new URLSearchParams(location.search);

/* mc_attr fallback: derive s1 (e=<spark> .. c=<code>) when the launcher did not
   pass it directly. If neither field exists s1 stays EMPTY — never fabricated. */
if (!q.get('s1')) {
  var mc = q.get('mc_attr') || '', f = {};
  mc.split('..').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) f[kv.slice(0, i)] = kv.slice(i + 1); });
  var d = f.e || f.c; if (d) q.set('s1', d);
}

/* Referrer rescue for a stripped query (in-app browsers drop params on some hops). */
if ((!q.get('s1') || !q.get('utm_campaign')) && document.referrer) {
  try {
    var r = new URLSearchParams(new URL(document.referrer).search);
    ['s1','s2','s3','s4','utm_campaign','campaign','ttclid','lg'].forEach(function(k){
      if (!q.get(k) && r.get(k)) q.set(k, r.get(k));
    });
  } catch(e) {}
}

/* Drop unsubstituted TikTok macros rather than forwarding the literal placeholder. */
var tt = q.get('ttclid') || '';
if (tt && (tt.indexOf('CLICK_ID') > -1 || tt.indexOf('__CLICKID__') > -1 || tt.indexOf('{{') > -1 || tt.indexOf('}}') > -1)) q.delete('ttclid');

var s1 = q.get('s1') || '';
var campaign = q.get('utm_campaign') || q.get('campaign') || '';
var ttclid = q.get('ttclid') || '';

/* NO UA SNIFFING, deliberately. A lander that appears to behave differently for a crawler is what
   gets the whole domain flagged and every campaign on it blocked. Attribution does not need a gate
   here: the door 404s any click with no s1 (api/link/[slug].js). */

/* Door URL: every param rides, with s1 placed LAST (ad automations append to the
   tail). The door 404s a click with no s1 — by design, that is the real gate. */
function buildDoorUrl() {
  var out = new URLSearchParams(q.toString());
  out.delete('s1');
  out.delete('lg');   // routes the lander only — the door/network never sees it
  var qs = out.toString();
  var url = DOOR + (qs ? '?' + qs : '');
  if (s1) url += (qs ? '&' : '?') + 's1=' + encodeURIComponent(s1);
  return url;
}
var target = buildDoorUrl();

if (window.ttq) {
  try { ttq.track('ViewContent', { content_name: 'Apple Pay US Landing', value: GEO_VALUE }); } catch(e) {}
}

var ctaBtn = document.getElementById('ctaBtn');
var clicking = false, hasTouched = false;

function handleCta(e) {
  e.preventDefault();
  if (clicking) return;
  clicking = true;
  ctaBtn.textContent = 'Loading\u2026';
  ctaBtn.setAttribute('disabled', 'disabled');
  if (window.ttq) {
    try { ttq.track('ClickButton', { content_name: 'Apple Pay US CTA', value: GEO_VALUE }); } catch(e) {}
  }
  location.replace(target);
}
ctaBtn.addEventListener('touchend', function(e){ hasTouched = true; handleCta(e); }, {passive:false});
ctaBtn.addEventListener('click', function(e){ if (!hasTouched) handleCta(e); });

if (location.hostname === 'localhost' || location.search.indexOf('debug=1') > -1) {
  console.log('[applepay750-us-d/wallet-pass debug]', {
    geo: document.documentElement.getAttribute('data-geo') || '(unknown)',
    s1: s1 || '(none - door will 404)',
    campaign: campaign || '(none)',
    ttclid: ttclid || '(none)',
    target: target
  });
}
})();
</script>
